name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Cancel stale runs for the same branch/PR as new ones start.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Most JS actions here are now pinned to Node-24-native majors. Three
# holdouts still target Node 20:
#   - actions/upload-artifact@v5    (authored for node20; v5 is the latest major)
#   - actions/download-artifact@v5  (same)
#   - gitleaks/gitleaks-action@v2   (no v3 shipped)
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 is GitHub's opt-in that makes
# the runner execute node20 bundles on Node 24. Drops automatically
# when each action's next major ships Node 24; Dependabot tracks
# those bumps.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.5"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5 (node24)
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6 (node24)
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Set up Python
        # python3 is required for the built-in script processors'
        # on-disk C6 integration test, and will be needed by
        # `thlibo exec` at runtime as well.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (node24)
        with:
          python-version: "3.12"
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        # 120s timeout is generous; current suite is ~70s on a dev
        # box, most of which is the daemon integration tests.
        run: go test ./... -timeout 120s
      - name: python processor tests
        # The script processors' own unit tests (pure-python, no PDF or
        # model fixtures) — they pin parsing heuristics the Go suite
        # can't reach. PYTHONUTF8 because processor output contains
        # em-dashes and smart quotes that crash cp1252 consoles.
        #
        # One `unittest` subprocess per file, not one batched run: some
        # of these tests do a bare `import run`, so batching lets the
        # first processor's run.py win the `run` module name for all of
        # them. Separate processes keep each test importing its own.
        #
        # Driven by python rather than a shell loop because this job is
        # a matrix across ubuntu/macos/windows, and the Windows runner's
        # default shell is pwsh — a bash `while ... done` loop is a
        # PowerShell parse error there.
        env:
          PYTHONUTF8: "1"
        run: python scripts/run_processor_tests.py

  scanners:
    name: scanners
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5 (node24)
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6 (node24)
        with:
          go-version: "1.26.5"
          cache: true

      - name: gofmt
        # Linux-only on purpose: this job's checkout is LF, so the check
        # is about real formatting. On a Windows checkout with
        # core.autocrlf=true every file reports as unformatted.
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error ::gofmt: the following files need formatting"
            echo "$UNFORMATTED"
            gofmt -d .
            exit 1
          fi
          echo "gofmt clean"

      # The three scanner installs below are version-pinned, not `@latest`.
      # `@latest` resolves at job time, so whatever is tagged latest when CI
      # runs is what executes in a job with repository access — the shape of
      # the Trivy compromise. Go's module proxy and checksum database do
      # verify integrity, which makes this weaker than the Actions-tag case,
      # but they verify bytes rather than intent: a malicious release of a
      # legitimate module still installs cleanly. Pinning also makes a CI
      # result reproducible: a new scanner release changing its own rules is
      # otherwise indistinguishable from our code regressing.
      #
      # These are NOT tracked by Dependabot. It watches `go.mod` and `uses:`
      # SHAs; a `go install` line in a `run:` body is invisible to both, so
      # bumping them is a manual chore. They are deliberately not added to
      # `go.mod` as tool dependencies: that would pull each scanner's whole
      # dependency tree into our module graph, where the govulncheck gate
      # below fails the job on any third-party CVE — a vulnerability in a
      # linter's transitive dep would then block unrelated work.
      #
      # Bumping one: resolve the real latest at runtime
      # (`go list -m -versions <module>`), never from memory, and skip
      # prereleases — v0.8.0-rc.1 of staticcheck is not a candidate.
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: staticcheck
        run: staticcheck ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck (informational for stdlib)
        # Fails the job only when a third-party dependency has an
        # exploitable CVE. Go stdlib findings are informational: they follow
        # the compiler's release cadence, not ours, and a fresh CVE every
        # month would block unrelated work. They get chased via Go version
        # bumps on our own schedule.
        #
        # Read the JSON, not the human output. The text format has no stable
        # contract — `-show=summary` was removed upstream and the step then
        # failed on "invalid value for flag -show" for at least a week
        # (2026-07-28 through 2026-08-04, under both `@latest` and the
        # v1.6.0 pin). `set +e` swallowed the non-zero exit, `$OUT` was
        # empty, and the grep below found nothing to fail on — so the gate
        # reported success while scanning nothing. A gate that cannot fail
        # is worse than no gate, because it is indistinguishable from a
        # passing one.
        #
        # `-format=json` is a declared interface: `osv` entries are the
        # advisories and `finding` entries are what is actually reachable in
        # our code, each carrying the module it belongs to. Findings with no
        # trace are advisory-only (imported but not called) and are not
        # counted; only a finding whose most specific frame names a
        # non-stdlib module fails the job.
        run: |
          set -o pipefail
          govulncheck -format=json ./... > vulns.json
          python3 - <<'PY'
          import json, sys

          # One JSON object per top-level value, concatenated. encoding is
          # explicit because govulncheck emits UTF-8 and Python would
          # otherwise use the platform default (this decoded as cp1252 and
          # crashed when the fix was written on Windows).
          dec, buf, objs = json.JSONDecoder(), open("vulns.json", encoding="utf-8").read(), []
          i = 0
          while i < len(buf):
              while i < len(buf) and buf[i].isspace():
                  i += 1
              if i >= len(buf):
                  break
              obj, i = dec.raw_decode(buf, i)
              objs.append(obj)

          third_party = {}
          for o in objs:
              f = o.get("finding")
              if not f or not f.get("trace"):
                  continue  # advisory only: imported, not reachable
              mod = f["trace"][0].get("module", "")
              if mod and mod != "stdlib":
                  third_party.setdefault(mod, set()).add(f.get("osv", "?"))

          for o in objs:
              f = o.get("finding")
              if f and f.get("trace"):
                  m = f["trace"][0].get("module", "?")
                  print(f"reachable: {f.get('osv')} in {m}")

          if not objs:
              print("::error ::govulncheck produced no output; the scan did not run")
              sys.exit(1)
          if third_party:
              for mod, ids in sorted(third_party.items()):
                  print(f"::error ::{mod}: {', '.join(sorted(ids))}")
              sys.exit(1)
          print(f"no reachable third-party CVEs ({len(objs)} records scanned)")
          PY

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - name: gosec (shipped code only)
        # .test/ is a gitignored dev sandbox; we scan only what we ship.
        run: gosec ./cmd/... ./internal/... ./processors/...

      - name: Set up Python
        # semgrep is python-based.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (node24)
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep
      - name: semgrep
        # --error makes medium+ findings fail the job; auto config pulls
        # in the semgrep-registry rules for every language it detects.
        #
        # Scans the WHOLE repo, not just ./cmd ./internal ./processors.
        # The narrower path silently excluded the two highest-value
        # supply-chain surfaces we have — `.github/workflows/*` (which
        # run with `contents: write` + `id-token: write`) and
        # `.github/dependabot.yml` — so six real findings, including
        # tag-name shell injection in release.yml, sat unreported. A
        # scanner that can't see the release pipeline isn't gating it.
        # Deliberate false positives carry `// nosemgrep` with a reason,
        # per the repo convention.
        run: semgrep --config=auto --error --quiet .

  secrets:
    name: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5 (node24)
        with:
          # Full history so gitleaks can look at commit diffs.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
